<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sinclair — Minimal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bg2:#111;--ink:#f5f5f0;--ink2:#888;--ink3:#555;--ink4:#2a2a2a;
  --accent:#d4ff3a;--red:#ff4848;
  --sans:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
body{padding:0;margin:0}

.container{max-width:1440px;margin:0 auto;padding:40px 56px 80px}

/* MINIMAL NAV */
.nav{display:flex;justify-content:space-between;align-items:center;padding:0 0 48px;border-bottom:1px solid var(--ink4)}
.nav-brand{font-weight:700;font-size:14px;letter-spacing:-.01em}
.nav-brand span{color:var(--ink3);font-weight:400;margin-left:8px}
.nav-meta{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.nav-meta .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* HERO — Big Number */
.hero{padding:80px 0 96px;display:grid;grid-template-columns:1fr 1fr;gap:80px;border-bottom:1px solid var(--ink4)}
.hero-left .tiny{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.22em;text-transform:uppercase;margin-bottom:40px}
.hero-left .big-sym{font-size:14px;font-weight:500;color:var(--ink2);margin-bottom:4px}
.hero-left .big-price{font-size:160px;font-weight:200;line-height:.85;letter-spacing:-.065em;font-feature-settings:"tnum";margin-bottom:24px}
.hero-left .big-chg{display:inline-block;font-family:var(--mono);font-size:14px;padding:6px 0;border-top:1px solid var(--ink4);border-bottom:1px solid var(--ink4);min-width:280px}
.big-chg .up{color:var(--accent)}
.big-chg .dn{color:var(--red)}

.hero-right{display:flex;flex-direction:column;justify-content:space-between}
.scen-block .tiny{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.22em;text-transform:uppercase;margin-bottom:16px}
.scen-name{font-size:56px;font-weight:300;letter-spacing:-.035em;line-height:1;margin-bottom:24px;color:var(--accent)}
.scen-note{font-size:16px;font-weight:300;color:var(--ink2);line-height:1.5;max-width:440px}
.regime-strip{display:flex;gap:32px;padding-top:40px;border-top:1px solid var(--ink4);margin-top:40px}
.regime-item{display:flex;flex-direction:column;gap:4px}
.regime-item .k{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.18em;text-transform:uppercase}
.regime-item .v{font-size:18px;font-weight:500;font-family:var(--mono);letter-spacing:-.01em}

/* SECTION */
.section{padding:80px 0;border-bottom:1px solid var(--ink4)}
.section:last-child{border-bottom:none}
.sec-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:56px}
.sec-num{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.2em}
.sec-title{font-size:32px;font-weight:300;letter-spacing:-.02em}
.sec-count{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.15em;text-transform:uppercase}

/* LEVELS GRID */
.levels{display:grid;grid-template-columns:repeat(5,1fr)}
.lvl{padding:0 24px 0 0;border-right:1px solid var(--ink4);min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.lvl:last-child{border-right:none}
.lvl .tag{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.18em;text-transform:uppercase}
.lvl .num{font-size:56px;font-weight:300;letter-spacing:-.035em;line-height:.9;font-feature-settings:"tnum"}
.lvl .note{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.lvl.king .num{color:var(--accent)}

/* NODE LADDER */
.ladder{position:relative}
.ladder-row{display:grid;grid-template-columns:80px 140px 1fr 120px;align-items:center;gap:32px;padding:18px 0;border-bottom:1px solid var(--ink4);transition:background .15s}
.ladder-row:hover{background:rgba(212,255,58,.02)}
.ladder-row.king{background:rgba(212,255,58,.04)}
.ladder-strike{font-size:28px;font-weight:300;letter-spacing:-.02em;font-feature-settings:"tnum"}
.ladder-type{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.ladder-type.t-KING{color:var(--accent)}
.ladder-type.t-VELOCITY{color:var(--red)}
.ladder-type.t-GATEKEEPER{color:var(--ink)}
.ladder-bar-wrap{position:relative;height:2px;background:var(--ink4)}
.ladder-bar-center{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink3)}
.ladder-bar-fill{position:absolute;top:-4px;bottom:-4px;height:10px}
.ladder-bar-fill.pos{background:var(--accent);left:50%}
.ladder-bar-fill.neg{background:var(--red);right:50%}
.ladder-gex{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.ladder-gex.pos{color:var(--accent)}
.ladder-gex.neg{color:var(--red)}

/* FOOTER */
.footer{padding:40px 0 0;display:flex;justify-content:space-between;color:var(--ink3);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
